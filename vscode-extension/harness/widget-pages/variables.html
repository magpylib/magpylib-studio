<!doctype html>
<!--
  An editable view of a scene with variables -- the model of variables.json --
  against a fake kernel that answers the panel's calls from the fixture: the
  variables as listed, a set moving the one it names, the scene for a redraw.
  `?standalone` is a saved page, `?readonly` a view with its handles away;
  neither offers the panel. `?variants` gives the scene two variants, the
  values in neither, and `?many` six, too many for a toggle each; `?broken`
  says one of them cannot be used as the scene stands. `window.result` is what the panel showed and
  what it asked the session, in order, with a previewed value marked `*` and a
  committed one `=`.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/static/widget.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import widget from "/static/widget.js";

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test) => {
        for (let i = 0; i < 80 && !test(); i++) await wait(50);
        return test();
      };
      const { state, scene, variables } = await (
        await fetch("/out/variables.json")
      ).json();
      const query = new URLSearchParams(location.search);
      // `?taken`: a later step states r outright, so the panel offers to let
      // it decide again
      if (query.has("taken")) {
        const r = variables.variables.find((v) => v.name === "r");
        r.inert = true;
        r.shadowed = [{ events: ["ring-pattern"] }];
      }
      // `?variants`: two variants, in neither of which the values are;
      // `?many`: six, which would crowd the row as toggles
      if (query.has("variants")) {
        variables.variants = {
          compact: { n: 4, r: 0.015 },
          wide: { n: 16, r: 0.03 },
        };
        variables.variant = null;
      }
      if (query.has("broken")) {
        variables.unusable = { wide: "r = 0.03 is above its maximum 0.025" };
      }
      if (query.has("many")) {
        variables.variants = Object.fromEntries(
          [4, 6, 8, 12, 16, 20].map((n) => [`n${n}`, { n }]),
        );
        variables.variant = null;
      }
      const values = { ...state };
      if (query.has("standalone")) values.standalone = true;
      if (query.has("readonly")) values.editable = false;
      // For a look: the view wears what it sits on, and a headless browser's
      // own preference is whichever it is, so the page says.
      if (query.has("dark")) document.body.style.background = "#1e1e1e";
      if (query.has("light")) document.body.style.background = "#ffffff";

      const asked = [];
      const listeners = {};
      const emit = (event, value) =>
        (listeners[event] || []).forEach((listener) => listener(value));
      const model = {
        get: (key) => values[key],
        set(key, value) {
          values[key] = value;
          emit(`change:${key}`, value);
        },
        save_changes() {},
        on: (event, listener) => (listeners[event] ||= []).push(listener),
        off() {},
        send(message) {
          if (message.kind !== "rpc") return;
          const { method, params } = message;
          asked.push({
            method,
            params,
            preview: message.preview === true,
            scene: message.scene === true,
          });
          let result = { ok: true };
          if (method === "get_variables") result = variables;
          else if (method === "get_scene") result = scene;
          else if (method === "set_variable") {
            const found = variables.variables.find(
              (v) => v.name === params.name,
            );
            if (found) found.value = found.expression = params.value;
            // a preview asks for the scene in its own answer
            if (message.scene) result = { ok: true, scene };
          } else if (method === "use_variant") {
            const set = variables.variants[params.name];
            for (const [name, value] of Object.entries(set)) {
              const found = variables.variables.find((v) => v.name === name);
              if (found) found.value = found.expression = value;
            }
            variables.variant = params.name;
          } else if (method === "expression_help") {
            result = {
              operators: ["+", "-"],
              functions: ["sin"],
              constants: ["pi"],
              examples: ["2 * n"],
              note: "",
            };
          }
          setTimeout(
            () => emit("msg:custom", { kind: "rpc", id: message.id, result }),
            10,
          );
        },
      };

      const el = document.getElementById("root");
      widget.render({ model, el });
      await until(() => el.querySelector("canvas"));
      if (query.has("dock"))
        el.style.setProperty("--magpy-dock-width", query.get("dock") + "px");
      await wait(300);
      const button = (start) =>
        [...el.querySelectorAll(".magpy-icon")].find((b) =>
          b.title.startsWith(start),
        );
      const hidden = (b) => !b || Boolean(b.closest("[hidden]"));
      const offered = !hidden(button("Variables"));
      if (!offered) {
        window.result = { offered, asked };
      } else if (query.has("taken")) {
        // the one restore in the dock's title line, none in the rows, and
        // the restoring one step
        button("Variables").click();
        await until(() => el.querySelectorAll(".magpy-vars-row").length);
        await wait(200);
        const pill = el.querySelector(
          ".magpy-scene-dock-head .magpy-vars-restore",
        );
        const inRows = Boolean(el.querySelector(".magpy-vars-acts button"));
        const mark = asked.length;
        pill?.click();
        await wait(500);
        window.result = {
          offered,
          restore: { inHead: Boolean(pill), inRows, label: pill?.textContent },
          restored: asked
            .slice(mark)
            .filter((a) => a.method === "restore_variable")
            .map((a) => a.params.name),
          grouped: asked.slice(mark).map((a) => a.method),
        };
      } else if (
        (query.has("variants") || query.has("many")) &&
        !query.has("keep")
      ) {
        // above the rows, a toggle per variant -- or a dropdown, past a few
        // -- with none pressed; one press asks the session once, settled,
        // the rows are read back, and a press on the pressed one asks
        // nothing
        button("Variables").click();
        await until(() => el.querySelectorAll(".magpy-vars-row").length);
        await wait(200);
        const variantRow = el.querySelector(".magpy-vars-variant");
        const chips = () => [...el.querySelectorAll(".magpy-vars-chip")];
        const pick = () => el.querySelector(".magpy-vars-variant select");
        const pressed = () =>
          chips()
            .filter((c) => c.classList.contains("on"))
            .map((c) => c.textContent);
        const chosen = () => pick()?.selectedOptions[0]?.textContent ?? null;
        const shown = !hidden(variantRow);
        const toggles = chips().map((c) => c.textContent);
        const disabled = chips()
          .filter((c) => c.disabled)
          .map((c) => c.textContent);
        const dropdown = pick()
          ? [...pick().options].map((o) => o.textContent)
          : [];
        const before = toggles.length ? pressed() : chosen();
        const target = toggles.length ? "wide" : "n16";
        const mark = asked.length;
        if (toggles.length) {
          chips()
            .find((c) => c.textContent === target)
            ?.click();
        } else if (pick()) {
          pick().value = target;
          pick().dispatchEvent(new Event("change", { bubbles: true }));
        }
        await wait(400);
        const used = asked
          .slice(mark)
          .filter((a) => a.method === "use_variant")
          .map((a) => [a.params.name, a.preview]);
        const readBack = asked
          .slice(mark)
          .some((a) => a.method === "get_variables");
        const after = toggles.length ? pressed() : chosen();
        const n = [...el.querySelectorAll(".magpy-vars-row")]
          .find(
            (r) =>
              r.querySelector(".magpy-vars-name").textContent.split(" ")[0] ===
              "n",
          )
          ?.querySelector(".magpy-vars-value")?.value;
        const again = asked.length;
        chips()
          .find((c) => c.classList.contains("on"))
          ?.click();
        await wait(300);
        window.result = {
          offered,
          variants: {
            shown,
            toggles,
            disabled,
            dropdown,
            before,
            used,
            readBack,
            after,
            n,
            pressedAgain: asked
              .slice(again)
              .filter((a) => a.method === "use_variant").length,
          },
        };
      } else if (query.has("keep")) {
        // For a look: the panel open, and nothing done to it.
        button("Variables").click();
        await until(() => el.querySelectorAll(".magpy-vars-row").length);
        await wait(300);
        window.result = { offered, kept: true };
      } else {
        button("Variables").click();
        await until(() => el.querySelectorAll(".magpy-vars-row").length);
        await wait(200);
        const rowsOf = () => [...el.querySelectorAll(".magpy-vars-row")];
        const rows = rowsOf().map((r) => ({
          name: r.querySelector(".magpy-vars-name").textContent,
          slider: Boolean(r.querySelector("input[type=range]")),
          select: Boolean(r.querySelector("select")),
          expression: Boolean(
            r
              .querySelector(".magpy-vars-value")
              ?.classList.contains("magpy-vars-expr"),
          ),
          value: r.querySelector(".magpy-vars-value")?.value ?? null,
        }));
        // Read while the panel is open: the pencil below hides it, and with
        // it any row, offered or not.
        const variantRow = !hidden(el.querySelector(".magpy-vars-variant"));
        const row = (name) =>
          rowsOf().find(
            (r) =>
              r.querySelector(".magpy-vars-name").textContent.split(" ")[0] ===
              name,
          );

        // A slider drag: three values under the pointer, released on the last.
        const slider = row("n").querySelector("input[type=range]");
        const mark = asked.length;
        slider.dispatchEvent(
          new PointerEvent("pointerdown", { bubbles: true }),
        );
        for (const value of [12, 14, 16]) {
          slider.value = String(value);
          slider.dispatchEvent(new Event("input", { bubbles: true }));
          await wait(60);
        }
        slider.dispatchEvent(new Event("change", { bubbles: true }));
        slider.dispatchEvent(new PointerEvent("pointerup", { bubbles: true }));
        await wait(500);
        // redrawn between the values: the scene asked for, in the preview's
        // own answer or in a message of its own
        const redrawn = asked
          .slice(mark)
          .some((a) => a.method === "get_scene" || (a.preview && a.scene));
        const drag = asked
          .slice(mark)
          .map(
            (a) =>
              a.method +
              (a.method === "set_variable"
                ? (a.preview ? "*" : "=") + a.params.value
                : ""),
          );

        // A dropdown: one choice, one commit.
        const pick = row("axis").querySelector("select");
        const before = asked.length;
        pick.value = [...pick.options].find((o) => o.textContent === "x").value;
        pick.dispatchEvent(new Event("change", { bubbles: true }));
        await wait(300);
        const chose = asked
          .slice(before)
          .filter((a) => a.method === "set_variable")
          .map((a) => [a.params.name, a.params.value, a.preview]);

        // The handles put away take the panel with them.
        button("Edit").click();
        await wait(200);
        const afterPencil = {
          button: !hidden(button("Variables")),
          panel: !el.querySelector(".magpy-scene-variables").hidden,
        };
        window.result = {
          offered,
          variantRow,
          rows,
          drag,
          redrawn,
          chose,
          afterPencil,
          asked,
        };
      }
    </script>
  </body>
</html>

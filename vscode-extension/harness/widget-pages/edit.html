<!doctype html>
<!--
  An editable view -- the notebook widget over a session in the kernel --
  run against a fake kernel: the model a studio holds, with python's half of
  each call answered from a scene fixed in advance. The drag is the
  renderer's events on the view, as in studio-drag.html; the keys are keys.

  `?silent` answers nothing, as a notebook read without its kernel does.
  `?editor` hands the view an editor of the host's own on the model, as the
  VS Code studio panel does: the view's edits go to it, not to the kernel.
  `?typing` stops once the probe is selected, with `window.asked` to watch:
  the harness types into the readout itself, since only its keys are real
  keys, and a key sent from the page does what the page says, not what the
  browser would.

  `window.result` is what the view asked the session, in order, what its
  editing buttons showed along the way -- the handles, the axes, a resize
  refused for the probe and taken for the magnet -- and what it said.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/static/widget.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import widget from "/static/widget.js";

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test) => {
        for (let i = 0; i < 80 && !test(); i++) await wait(50);
        return test();
      };
      const { state, scene } = await (await fetch("/out/edit.json")).json();
      const silent = new URLSearchParams(location.search).has("silent");
      const ownEditor = new URLSearchParams(location.search).has("editor");
      const typing = new URLSearchParams(location.search).has("typing");

      const asked = [];
      const values = { ...state };
      const listeners = {};
      const emit = (event, value) =>
        (listeners[event] || []).forEach((listener) => listener(value));
      const model = {
        get: (key) => values[key],
        set(key, value) {
          values[key] = value;
          emit(`change:${key}`, value);
        },
        save_changes() {},
        on: (event, listener) => (listeners[event] ||= []).push(listener),
        off() {},
        send(message) {
          if (message.kind !== "rpc") return;
          if (ownEditor) {
            asked.push({ method: `kernel:${message.method}` }); // must not happen
            return;
          }
          const position = message.params?.edits?.[0]?.position;
          asked.push({
            method: message.method,
            x: position?.[0],
            position,
            scene: message.scene === true,
          });
          if (silent) return;
          // a preview asks for the scene in its own answer
          const result =
            message.method === "get_scene"
              ? scene
              : message.method === "quantity"
                ? { ok: true, value: Number(message.params.text) }
                : message.scene
                  ? { ok: true, scene }
                  : { ok: true };
          setTimeout(
            () => emit("msg:custom", { kind: "rpc", id: message.id, result }),
            20,
          );
        },
      };

      if (ownEditor) {
        // the host's editor: what it was asked, in the kernel's words
        const answered = (method, x) => {
          asked.push({ method, x });
          return new Promise((resolve) =>
            setTimeout(
              () => resolve(method === "get_scene" ? scene : { ok: true }),
              20,
            ),
          );
        };
        const at = (edits) => edits?.[0]?.position?.[0];
        model.editor = {
          begin: () => answered("begin_interaction"),
          preview: (edits) => answered("apply_edits", at(edits)),
          async commit(edits) {
            const done = await answered("apply_edits", at(edits));
            asked.push({ method: "end_interaction" });
            return done;
          },
          scene: () => answered("get_scene"),
          quantity: (text) =>
            Promise.resolve({ ok: true, value: Number(text) }),
          undo: () => answered("undo"),
          redo: () => answered("redo"),
        };
      }
      const el = document.getElementById("root");
      widget.render({ model, el });
      await until(() => el.querySelector("canvas"));
      await wait(500);
      model.set("selected", ["probe"]); // the handles go to the selection
      await wait(200);
      if (typing) {
        window.asked = asked;
        window.ready = true;
        await new Promise(() => {}); // the rest is the harness's
      }

      const button = (start) =>
        [...el.querySelectorAll(".magpy-icon")].find((b) =>
          b.title.startsWith(start),
        );
      const stage = el.querySelector(".magpy-scene-stage");
      const press = (key, extra = {}) =>
        stage.dispatchEvent(
          new KeyboardEvent("keydown", { key, bubbles: true, ...extra }),
        );
      const noticed = () =>
        el.querySelector(".magpy-scene-notice.shown")?.textContent ?? null;
      press("e");
      const turned = button("Turn").getAttribute("aria-pressed");
      press("l");
      const local = button("Axes:").title;
      press("l");
      const world = button("Axes:").title;
      press("r"); // a sensor has no size to drag
      const refused = {
        notice: noticed(),
        moving: button("Move").getAttribute("aria-pressed"),
      };
      model.set("selected", ["magnet"]);
      await wait(100);
      const resizing = button("Resize").getAttribute("aria-pressed");
      model.set("selected", ["probe"]);
      await wait(100);
      press("w");
      const moved = button("Move").getAttribute("aria-pressed");

      const view = el.querySelector(".magpy-scene-view");
      const fire = (type, detail) =>
        view.dispatchEvent(new CustomEvent(type, { detail }));
      const pose = (x, preview = true) => ({
        preview,
        edits: [{ objectId: "probe", position: [x, 0, 0.02] }],
      });
      fire("dragstart", { objectIds: ["probe"], mode: "translate" });
      for (let x = 1; x <= 5; x++) fire("objecttransform", pose(x));
      // long enough, when nothing answers, for the view to give up
      await wait(silent ? 4600 : 500);
      fire("objecttransform", pose(6, false));
      await wait(300);
      press("z", { metaKey: true });
      await wait(200);

      // The readout: the probe's position, as boxes that take a typed value
      // -- and a key typed into one is a character, not a command.
      await wait(100);
      const head = el.querySelector(".magpy-scene-readout-head")?.textContent;
      const boxes = [...el.querySelectorAll(".magpy-scene-readout input")];
      let typedIn = null;
      if (boxes.length) {
        boxes[0].focus();
        boxes[0].dispatchEvent(
          new KeyboardEvent("keydown", { key: "e", bubbles: true }),
        );
        typedIn = button("Move").getAttribute("aria-pressed");
        boxes[0].value = "0.5";
        boxes[0].dispatchEvent(new Event("change"));
        await wait(200);
      }
      button("Keys").click();
      const keys = el.querySelector(".magpy-scene-keys")?.textContent ?? "";
      // The revert button, where the editor has a start to go back to.
      const revert = button("Back to");
      if (revert && !revert.closest("[hidden]")) revert.click();
      await wait(200);

      // Shift+H: the probe alone; then the magnet alone, though something is
      // hidden already; then, the magnet being all that shows, everything
      const isolate = () => press("H", { shiftKey: true });
      model.set("selected", ["probe"]);
      isolate();
      const probeAlone = [...(values.hidden || [])];
      model.set("selected", ["magnet"]);
      isolate();
      const magnetAlone = [...(values.hidden || [])];
      isolate();
      const everything = [...(values.hidden || [])];

      window.result = {
        asked,
        buttons: {
          shown: !button("Undo").closest("[hidden]"),
          turned,
          moved,
          local,
          world,
          refused,
          resizing,
        },
        notice: el.querySelector(".magpy-scene-notice.shown")?.textContent,
        readout: { head, boxes: boxes.length, typedIn },
        keys,
        isolating: { probeAlone, magnetAlone, everything },
      };
    </script>
  </body>
</html>

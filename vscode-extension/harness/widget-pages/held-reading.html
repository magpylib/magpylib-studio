<!doctype html>
<!--
  The panel's own renderer, media/scene3d.mjs, drawing the studio's quiver
  example, then drawing it again part-way through a drag: first with the
  sensor held -- its arrows are its own reading -- then with the magnet held.
  The drag itself is not needed for this: what a drag does to a redraw is the
  `keep` it passes, and that is passed here.

  `window.result` is what became of each held object's node and drawing.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "/three/build/three.module.js",
          "three/addons/": "/three/examples/jsm/"
        }
      }
    </script>
    <style>
      #view {
        width: 640px;
        height: 420px;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module">
      import * as THREE from "three";
      import { scene3d } from "/media/scene3d.mjs";

      const [before, after] = await (await fetch("/out/readings.json")).json();
      const el = document.getElementById("view");
      const node = (id) => scene3d.byObjectId.get(id);
      const drawn = (id) => node(id).children.map((child) => child.uuid);
      // The middle of what is drawn on a node, from its vertices -- its
      // meshes, which is the sensor's axes -- and, apart, the middle of its
      // instanced pixels, from where each instance is put: an instance's
      // geometry is the one shape at the origin, so its vertices say nothing.
      const meshesOnScreen = (id) => {
        const box = new THREE.Box3();
        node(id).traverse((part) => {
          if (part.isMesh && !part.isInstancedMesh) {
            box.union(new THREE.Box3().setFromObject(part, true));
          }
        });
        return box.getCenter(new THREE.Vector3());
      };
      const pixelsOnScreen = (id) => {
        const sum = new THREE.Vector3();
        const matrix = new THREE.Matrix4();
        const at = new THREE.Vector3();
        let count = 0;
        node(id).traverse((part) => {
          if (!part.isInstancedMesh) return;
          part.updateWorldMatrix(true, false);
          for (let i = 0; i < part.count; i++) {
            part.getMatrixAt(i, matrix);
            at.setFromMatrixPosition(matrix).applyMatrix4(part.matrixWorld);
            sum.add(at);
            count++;
          }
        });
        return count ? sum.divideScalar(count) : null;
      };
      // the same two, from where the engine put them
      const meshesFromEngine = (payload, id) => {
        const box = new THREE.Box3();
        for (const item of payload.meshes) {
          if (item.object_id === id) {
            box.union(new THREE.Box3().setFromArray(item.position));
          }
        }
        return box.getCenter(new THREE.Vector3());
      };
      const pixelsFromEngine = (payload, id) => {
        const sum = new THREE.Vector3();
        let count = 0;
        for (const item of payload.pixels ?? []) {
          if (item.object_id !== id) continue;
          for (let i = 0; i < item.origins.length; i += 3) {
            sum.add(
              new THREE.Vector3(
                item.origins[i],
                item.origins[i + 1],
                item.origins[i + 2],
              ),
            );
            count++;
          }
        }
        return count ? sum.divideScalar(count) : null;
      };
      const near = (a, b) => a !== null && b !== null && a.distanceTo(b) < 1e-6;

      scene3d.render(el, before);
      const sensorNode = node("field");
      const sensorWas = drawn("field");
      scene3d.render(el, after, { keep: ["field"] }); // the sensor held
      const sensor = {
        sameNode: node("field") === sensorNode,
        redrawn:
          drawn("field").length > 0 &&
          drawn("field").every((uuid) => !sensorWas.includes(uuid)),
        moved:
          meshesFromEngine(after, "field").distanceTo(
            meshesFromEngine(before, "field"),
          ) > 1e-4 &&
          near(meshesOnScreen("field"), meshesFromEngine(after, "field")) &&
          near(pixelsOnScreen("field"), pixelsFromEngine(after, "field")),
      };

      const magnetNode = node("magnet");
      const magnetWas = drawn("magnet");
      scene3d.render(el, after, { keep: ["magnet"] }); // the magnet held
      const magnet = {
        sameNode: node("magnet") === magnetNode,
        untouched: drawn("magnet").join() === magnetWas.join(),
      };
      window.result = { sensor, magnet };
    </script>
  </body>
</html>

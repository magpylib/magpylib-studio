<!doctype html>
<!--
  A read-only view of the cell's objects -- the model of edit.json with
  `editable` false -- and the pencil among its tools, against a fake kernel
  that answers the press as python does: the session's scene and tree set on
  the model. `?standalone` is a saved page, with no python to ask; `?empty`
  a view with nothing named to edit. `window.result` is what the pencil did.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/static/widget.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import widget from "/static/widget.js";

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test) => {
        for (let i = 0; i < 80 && !test(); i++) await wait(50);
        return test();
      };
      const { state, scene } = await (await fetch("/out/edit.json")).json();
      const query = new URLSearchParams(location.search);
      const values = { ...state, editable: false };
      if (query.has("standalone")) values.standalone = true;
      if (query.has("empty")) values.tree = [];
      if (query.has("never")) values.editable = null; // SceneWidget(..., editable=None)

      const saved = []; // what the view saved `editable` as, each time
      const listeners = {};
      const emit = (event, value) =>
        (listeners[event] || []).forEach((listener) => listener(value));
      const model = {
        get: (key) => values[key],
        set(key, value) {
          values[key] = value;
          emit(`change:${key}`, value);
        },
        save_changes() {
          saved.push(values.editable);
          if (!values.editable) return;
          // python, told, copies the objects into a session and draws it
          setTimeout(() => {
            model.set("payload", { ...scene });
            model.set(
              "tree",
              state.tree.map((node) => ({ ...node })),
            );
          }, 20);
        },
        on: (event, listener) => (listeners[event] ||= []).push(listener),
        off() {},
        send() {},
      };

      const el = document.getElementById("root");
      widget.render({ model, el });
      await until(() => el.querySelector("canvas"));
      await wait(300);
      const button = (start) =>
        [...el.querySelectorAll(".magpy-icon")].find((b) =>
          b.title.startsWith(start),
        );
      const hidden = (b) => !b || Boolean(b.closest("[hidden]"));
      const pencil = button("Edit");
      const seen = () => ({
        pencil: !hidden(pencil),
        pressed: pencil?.getAttribute("aria-pressed"),
        bar: !hidden(button("Undo")),
      });
      const before = seen();
      if (!hidden(pencil)) pencil.click();
      await wait(300);
      const after = seen();
      const notice = el.querySelector(".magpy-scene-notice")?.textContent ?? "";
      if (!hidden(pencil)) pencil.click(); // again: the handles go away
      await wait(200);
      window.result = { before, after, again: seen(), saved, notice };
    </script>
  </body>
</html>

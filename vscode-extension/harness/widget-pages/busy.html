<!doctype html>
<!--
  An editable view of a scene with variables -- the model of inspector.json
  -- against a fake kernel that answers the object panel's calls from the
  fixture: the objects, each one's parameters, pose, style schema and style
  values, a typed value read as the number it is, a set answered with what it
  made. `?keep` opens the panel on the magnet and stops, for a look; `&style`
  unfolds the style tree too; `&narrow` makes the view 480px wide, where the
  dock is a sheet below it; `&dock=300` widens the column. `window.result`
  is what the panel showed, where the dock was, and what it asked the
  session.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/static/widget.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import widget from "/static/widget.js";

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test) => {
        for (let i = 0; i < 80 && !test(); i++) await wait(50);
        return test();
      };
      const fixture = await (await fetch("/out/inspector.json")).json();
      const {
        state,
        scene,
        variables,
        objects,
        params,
        transforms,
        schemas,
        values: styles,
      } = fixture;
      const query = new URLSearchParams(location.search);
      if (query.has("light")) document.body.style.background = "#ffffff";
      if (query.has("dark")) document.body.style.background = "#1e1e1e";
      const values = { ...state };
      // `?coloured`: a colour set on the magnet already, for a look at the
      // title line's reset
      if (query.has("coloured")) styles.m.set.color = "#ff0000";

      const asked = [];
      const listeners = {};
      const emit = (event, value) =>
        (listeners[event] || []).forEach((listener) => listener(value));
      const known = new Set(variables.variables.map((v) => v.name));
      const made = (sent) => {
        // a bare name the scene lacks, as the engine would make it
        const names = [];
        for (const value of Object.values(sent)) {
          for (const v of [].concat(value ?? [])) {
            if (
              typeof v === "string" &&
              /^=\w+$/.test(v) &&
              !known.has(v.slice(1))
            ) {
              names.push(v.slice(1));
            }
          }
        }
        return names.length ? { ok: true, defined: names } : { ok: true };
      };
      const model = {
        get: (key) => values[key],
        set(key, value) {
          values[key] = value;
          emit(`change:${key}`, value);
        },
        save_changes() {},
        on: (event, listener) => (listeners[event] ||= []).push(listener),
        off() {},
        send(message) {
          if (message.kind !== "rpc") return;
          const { method, params: p } = message;
          asked.push({ method, params: p });
          let result = { ok: true };
          if (method === "list_objects") result = objects;
          else if (method === "get_params") result = params[p.object_id] ?? [];
          else if (method === "get_transform") result = transforms[p.object_id];
          else if (method === "get_variables") result = variables;
          else if (method === "get_scene") result = scene;
          else if (method === "get_schema") result = schemas[p.object_id];
          else if (method === "get_values") result = styles[p.object_id];
          else if (method === "apply_edit") {
            // kept, so the values read back say what was set
            styles[p.object_id].set[p.path] = p.value;
          } else if (method === "reset_style") {
            delete styles[p.object_id].set[p.path];
          } else if (method === "read_values")
            result = { ok: true, values: p.terms.map(Number) };
          else if (method === "set_param") result = made({ value: p.value });
          else if (method === "set_transform")
            result = made({ position: p.position, orientation: p.orientation });
          // the scene with the answer when asked for, as the kernel sends it
          if (message.scene) result = { ...result, scene };
          // answered as late as the page says: a quick python, or a slow one
          setTimeout(
            () => emit("msg:custom", { kind: "rpc", id: message.id, result }),
            window.delay ?? 10,
          );
        },
      };

      const el = document.getElementById("root");
      if (query.has("narrow")) el.style.width = "480px";
      widget.render({ model, el });
      await until(() => el.querySelector("canvas"));
      if (query.has("dock"))
        el.style.setProperty("--magpy-dock-width", query.get("dock") + "px");
      await wait(300);
      const button = (start) =>
        [...el.querySelectorAll(".magpy-icon")].find((b) =>
          b.title.startsWith(start),
        );
      const ring = () => el.querySelector(".magpy-scene-busy");
      const on = () => ring()?.classList.contains("on") ?? null;
      // a quick answer: the ring never comes on
      window.delay = 100;
      button("Variables").click();
      let quick = false;
      for (let t = 0; t < 500; t += 25) {
        quick ||= on();
        await wait(25);
      }
      button("Variables").click(); // closed again
      await wait(200);
      // a slow one: on once waited on, off once answered
      // `?slow=ms` keeps python waited on longer, for a look at the ring
      window.delay = Number(query.get("slow") ?? 1200);
      const askedAt = performance.now();
      button("Variables").click();
      await wait(250);
      const early = on();
      await wait(450); // 700 ms after asking
      const waiting = on();
      window.shot = true; // a picture may be taken now
      await until(() => !on());
      const answeredAfter = performance.now() - askedAt;
      // a slider moved on, or a magnet dragged, while each value is answered
      // in less than the ring's wait: the newest waits behind the one away,
      // the view falls behind the pointer, and the ring comes on once and
      // stays on until it catches up
      window.delay = 250;
      const flips = [];
      new MutationObserver(() => flips.push(on() ? "on" : "off")).observe(
        ring(),
        { attributeFilter: ["class"] },
      );
      const behind = async (start, move, release) => {
        flips.length = 0;
        start();
        for (let i = 1; i <= 10; i++) {
          move(i);
          await wait(100);
        }
        release();
        await wait(1200);
        return flips.join();
      };
      const slider = el.querySelector(".magpy-vars-row input[type=range]");
      const sliding = await behind(
        () =>
          slider.dispatchEvent(
            new PointerEvent("pointerdown", { bubbles: true }),
          ),
        (i) => {
          slider.value = String(Number(slider.min) + i);
          slider.dispatchEvent(new Event("input", { bubbles: true }));
        },
        () => {
          slider.dispatchEvent(new Event("change", { bubbles: true }));
          slider.dispatchEvent(
            new PointerEvent("pointerup", { bubbles: true }),
          );
        },
      );
      const host = el.querySelector(".magpy-scene-view");
      const fire = (type, detail) =>
        host.dispatchEvent(new CustomEvent(type, { detail }));
      const pose = (i) => [{ objectId: "m", position: [0.001 * i, 0, 0] }];
      const dragging = await behind(
        () => fire("dragstart", { objectIds: ["m"], mode: "translate" }),
        (i) => fire("objecttransform", { preview: true, edits: pose(i) }),
        () => fire("objecttransform", { preview: false, edits: pose(11) }),
      );
      // python busy past the view's patience: said, still rung, and the
      // answer taken when it comes, with nothing left saying it was not
      window.delay = 4600;
      slider.value = String(Number(slider.min) + 3);
      slider.dispatchEvent(new Event("change", { bubbles: true }));
      window.delay = 10;
      await wait(4300);
      const shown = () =>
        el.querySelector(".magpy-scene-notice.shown")?.textContent ?? "";
      const late = { said: shown(), waiting: on() };
      await wait(800);
      late.after = {
        ring: on(),
        notice: shown(),
        status: el.querySelector(".magpy-vars-status")?.textContent ?? "",
      };
      window.result = {
        exists: Boolean(ring()),
        quick,
        early,
        waiting,
        answeredAfter,
        behind: { slider: sliding, drag: dragging },
        late,
      };
    </script>
  </body>
</html>

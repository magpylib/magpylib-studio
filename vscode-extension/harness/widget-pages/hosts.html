<!doctype html>
<!--
  The widget in each notebook and docs theme it is meant to follow, dressed
  the way that host dresses itself and flipped the way it flips: `?host=`
  names one, and `window.flip(dark)` turns it. The widget is told nothing; it
  has to notice.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/static/widget.css" />
    <style id="host"></style>
  </head>
  <body>
    <div id="frame"><div id="widget"></div></div>
    <script type="module">
      import { widget, localModel } from "./host.mjs";

      const HOSTS = {
        // As VS Code's webview host dresses the page: body transparent, the
        // theme's colours as variables on the root, its kind on the body --
        // and the Jupyter extension's output area forced white behind it.
        // As a live VS Code notebook lays out a widget output -- recorded
        // from one, not from reading its source, which got it wrong: the
        // body transparent, the theme's kind on it and its colours as
        // variables on the root; the output white and padded 8px, and the
        // box inside it white again and padded 0 8px, holding an empty
        // `div.cell-output` beside the widget. `?layout=` says what else the
        // box holds: nothing (alone), sliders in the same VBox (shared), or
        // sliders that arrive after the view has drawn (late).
        vscode: {
          css: `
            body { margin: 0; background-color: transparent;
                   color: var(--vscode-editor-foreground); }
            .cell-output-ipywidget-background { background: rgb(255, 255, 255) !important; }
            .output { padding: 8px; }
            .output > .cell-output-ipywidget-background { padding: 0 8px; }
            .slider { color: #333; padding: 4px; }`,
          wrap(el) {
            const make = (className, ...children) => {
              const node = document.createElement("div");
              node.className = className;
              node.append(...children);
              return node;
            };
            const slider = () =>
              make(
                "lm-Widget widget-hbox",
                make("lm-Widget slider", "a slider, drawn for white"),
              );
            const layout = new URLSearchParams(location.search).get("layout");
            el.classList.add("lm-Widget");
            const holder = document.createElement("div");
            el.replaceWith(holder);
            let content = el;
            if (layout === "shared") {
              content = make("lm-Widget widget-vbox", slider(), el);
            } else if (layout === "late") {
              content = make("lm-Widget widget-vbox", el);
              window.arrive = () => content.prepend(slider());
            }
            holder.append(
              make(
                "widgetarea",
                make(
                  "cell_container",
                  make(
                    "output_container",
                    make(
                      "output cell-output-ipywidget-background",
                      make(
                        "cell-output-ipywidget-background",
                        make("cell-output cell-output"),
                        content,
                      ),
                    ),
                  ),
                ),
              ),
            );
          },
          flip(dark) {
            const style = document.documentElement.style;
            for (const [name, light, night] of [
              ["--vscode-editor-background", "#ffffff", "#121314"],
              ["--vscode-notebook-editorBackground", "#ffffff", "#121314"],
              ["--vscode-editor-foreground", "#3b3b3b", "#bbbebf"],
            ]) {
              style.setProperty(name, dark ? night : light);
            }
            const kind = dark ? "vscode-dark" : "vscode-light";
            document.body.classList.remove("vscode-dark", "vscode-light");
            document.body.classList.add(kind);
            document.body.dataset.vscodeThemeKind = kind;
          },
        },
        pydata: {
          css: `
            html[data-theme="light"] body { background: #ffffff; color: #222832; }
            html[data-theme="dark"] body { background: #14181e; color: #ced6dd; }
            body { margin: 0; padding: 12px; }`,
          flip(dark) {
            document.documentElement.dataset.theme = dark ? "dark" : "light";
          },
        },
        furo: {
          css: `
            body { background: #ffffff; margin: 0; padding: 12px; }
            body[data-theme="dark"] { background: #131416; color: #cfd0d0; }`,
          flip(dark) {
            document.body.dataset.theme = dark ? "dark" : "light";
          },
        },
        jupyterbook: {
          css: `
            body { background: #ffffff; margin: 0; padding: 12px; }
            html.dark body { background: #1c1917; color: #e7e5e4; }`,
          flip(dark) {
            document.documentElement.classList.toggle("dark", dark);
          },
        },
        // Nothing to flip: the system's own setting, turned from outside.
        sphinx: {
          css: `
            body { background: #ffffff; margin: 0; padding: 12px; }
            @media (prefers-color-scheme: dark) {
              body { background: #202020; color: #dddddd; }
            }`,
        },
        jupyterlab: {
          css: `
            body { margin: 0; }
            body[data-jp-theme-light="true"] #frame { background: #ffffff; padding: 12px; }
            body[data-jp-theme-light="false"] #frame { background: #111111; color: #eeeeee; padding: 12px; }`,
          flip(dark) {
            document.body.dataset.jpThemeLight = String(!dark);
          },
        },
      };

      const host = HOSTS[new URLSearchParams(location.search).get("host")];
      document.getElementById("host").textContent = host.css;
      host.wrap?.(document.getElementById("widget"));
      host.flip?.(false);
      window.flip = host.flip;
      widget.render({
        model: localModel(),
        el: document.getElementById("widget"),
      });
      window.ready = true;
    </script>
  </body>
</html>

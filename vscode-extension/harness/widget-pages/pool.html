<!doctype html>
<!--
  How notebooks hand the widget its element, and what the renderer pool has
  to survive. `?case=` names one; `window.result` is what happened.

  detached: Jupyter renders a widget before attaching it. Two rendered
    together must be two views -- once, they shared a renderer and the
    first lost its canvas.
  reused: marimo re-running a cell takes a drawn view off the page without
    tearing it down. The next view must still get a renderer.
  stale: and the view taken off the page still has a model python can set.
    Setting it must not reach the renderer the next view now holds.
  projection: a renderer handed on keeps its state. The next view must
    start in perspective, with its button saying so.
  idle: a view nobody touches draws nothing -- it is drawn when it changes,
    not sixty times a second.
  cap: more views than the page has renderers for. No more than eight are
    live, those in sight are, and one reached for takes a renderer back.
  boxed: and drawn before they are on the page, which is how a box of them
    arrives. Still no more than eight, and each shows something.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/static/widget.css" />
    <script>
      // Every frame starts by clearing, so this counts the frames drawn.
      window.clears = 0;
      for (const context of [WebGLRenderingContext, WebGL2RenderingContext]) {
        const clear = context.prototype.clear;
        context.prototype.clear = function (...args) {
          window.clears += 1;
          return clear.apply(this, args);
        };
      }
    </script>
  </head>
  <body style="margin: 12px">
    <div id="page"></div>
    <script type="module">
      import { widget, localModel, wait } from "./host.mjs";

      const page = document.getElementById("page");
      const view = () => document.createElement("div");
      // The renderer's canvas: a resting view's picture is a canvas too.
      const LIVE = "canvas:not(.magpy-scene-still)";
      const drawn = (el) => Boolean(el.querySelector(LIVE));
      const livePool = () =>
        Object.getOwnPropertySymbols(globalThis)
          .filter((key) => key.description.startsWith("magpylib-studio"))
          .map((key) => globalThis[key].pool)[0];

      const CASES = {
        async detached() {
          const [a, b] = [view(), view()];
          widget.render({ model: localModel(), el: a });
          widget.render({ model: localModel(), el: b });
          await wait(0);
          page.append(a, b);
          await wait(1500);
          return { first: drawn(a), second: drawn(b) };
        },
        async reused() {
          const a = view();
          page.append(a);
          widget.render({ model: localModel(), el: a });
          await wait(1500);
          a.remove(); // and never torn down
          const b = view();
          page.append(b);
          widget.render({ model: localModel(), el: b });
          await wait(1500);
          return { next: drawn(b) };
        },
        async stale() {
          const a = view();
          page.append(a);
          const old = localModel();
          widget.render({ model: old, el: a });
          await wait(1500);
          a.remove();
          const b = view();
          page.append(b);
          widget.render({ model: localModel(), el: b });
          await wait(1500);
          // one renderer between them, so this is the one b draws with
          const nodes = window.scene3d.byObjectId;
          old.set("hidden", [...nodes.keys()]);
          old.set("axes", false);
          await wait(300);
          return { visible: [...nodes.values()].every((node) => node.visible) };
        },
        async projection() {
          const a = view();
          page.append(a);
          widget.render({ model: localModel(), el: a });
          await wait(1500);
          [...a.querySelectorAll(".magpy-icon")]
            .find((b) => b.title.startsWith("Orthographic"))
            .click();
          const was = window.scene3d.cameraState().projection;
          a.remove();
          const b = view();
          page.append(b);
          widget.render({ model: localModel(), el: b });
          await wait(1500);
          const button = [...b.querySelectorAll(".magpy-icon")].find((x) =>
            x.title.startsWith("Orthographic"),
          );
          return {
            was,
            now: window.scene3d.cameraState().projection,
            pressed: button.getAttribute("aria-pressed"),
          };
        },
        async idle() {
          const a = view();
          page.append(a);
          widget.render({ model: localModel(), el: a });
          await wait(1500);
          const drawn = window.clears;
          await wait(1000);
          return { drawn, idle: window.clears - drawn };
        },
        async cap() {
          const views = Array.from({ length: 11 }, view);
          page.append(...views);
          for (const each of views) {
            widget.render({ model: localModel(), el: each });
          }
          await wait(2500);
          const pool = livePool();
          const inSight = (el) => {
            const box = el.getBoundingClientRect();
            return box.bottom > 0 && box.top < innerHeight;
          };
          const before = {
            renderers: pool.length,
            canvases: page.querySelectorAll(LIVE).length,
            inSightLive: views.filter(inSight).every(drawn),
          };
          // The last out of sight and at rest: reached for, it wakes.
          const resting = views.filter((v) => !drawn(v)).at(-1);
          resting.dispatchEvent(new PointerEvent("pointerdown"));
          await wait(1000);
          return {
            ...before,
            woke: drawn(resting),
            after: page.querySelectorAll(LIVE).length,
            pictures: page.querySelectorAll("canvas.magpy-scene-still").length,
          };
        },
        async boxed() {
          // A box of views, all drawn before any is on the page.
          const views = Array.from({ length: 11 }, view);
          for (const each of views) {
            widget.render({ model: localModel(), el: each });
          }
          await wait(0);
          page.append(...views);
          await wait(2500);
          return {
            renderers: livePool().length,
            canvases: page.querySelectorAll(LIVE).length,
            // every view shows something: its scene, or how to have it
            shown: views.every(
              (v) => drawn(v) || v.querySelector(".magpy-scene-still"),
            ),
          };
        },
      };

      const name = new URLSearchParams(location.search).get("case");
      window.result = await CASES[name]();
    </script>
  </body>
</html>

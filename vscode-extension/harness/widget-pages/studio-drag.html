<!doctype html>
<!--
  The studio panel's own script -- media/studio.js, or studio.mjs -- taken
  through a drag the way the renderer takes it through one: by the events it
  dispatches on the canvas, not by a pointer, so what is checked is the
  panel's half of a drag and not the renderer's. VS Code and the renderer are
  stubs. The host answers a preview after a while, as the engine does.

  `window.result` is what the panel said to its host from the moment the drag
  began, in order, and what it asked the renderer to keep while it redrew.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      window.posted = [];
      window.kept = [];
      const SCENE = {
        meshes: [],
        scatters: [],
        patterned: [],
        parametric: {},
        anchors: { cube: [0, 0, 0] },
        orientations: {},
        shapes: {},
        polarizations: {},
      };
      const answer = (message, after = 0) =>
        setTimeout(() => window.postMessage(message, "*"), after);
      window.acquireVsCodeApi = () => ({
        postMessage(message) {
          window.posted.push(message);
          if (message.type === "rpcRequest") {
            answer({ type: "rpcResult", reqId: message.reqId, result: SCENE });
          } else if (message.type === "previewTransform") {
            answer({ type: "previewDone" }, 30); // the engine taking its time
          }
        },
      });
      // The renderer, as far as the panel asks of it: a mode is taken as
      // asked, there is one frame, and a redraw says what it keeps.
      const RENDERER = {
        setGizmoMode: (mode) => mode,
        frameCount: () => 1,
        spaceOf: () => "world",
        viewKey: () => false,
        render: (_el, _payload, options) => window.kept.push(options?.keep),
      };
      window.scene3d = new Proxy(RENDERER, {
        get: (target, name) => target[name] ?? (() => undefined),
      });
    </script>
  </head>
  <body>
    <script type="module">
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const until = async (test) => {
        for (let i = 0; i < 80 && !test(); i++) await wait(50);
        return test();
      };
      // Every element the panel looks up by id, as a plain element: which
      // kind it is in the real panel is not what is checked here, and a page
      // built from the ids cannot fall behind the panel's markup.
      const name = (await fetch("/media/studio.mjs")).ok
        ? "studio.mjs"
        : "studio.js";
      const source = await (await fetch(`/media/${name}`)).text();
      for (const [, id] of source.matchAll(/getElementById\("(\w+)"\)/g)) {
        const el = document.createElement("div");
        el.id = id;
        document.body.append(el);
      }
      document.getElementById("modeEdit").classList.add("on");
      document.getElementById("gizmo").value = "translate";
      const script = document.createElement("script");
      if (name.endsWith(".mjs")) script.type = "module";
      script.src = `/media/${name}`;
      document.body.append(script);
      await until(() => window.posted.some((m) => m.type === "rpcRequest"));
      await wait(200);

      postMessage({ type: "select", objectId: "cube" }, "*");
      await wait(100);
      const canvas = document.getElementById("canvas");
      const fire = (type, detail) =>
        canvas.dispatchEvent(new CustomEvent(type, { detail }));
      const pose = (x, preview = true) => ({
        preview,
        edits: [{ objectId: "cube", position: [x, 0, 0] }],
      });
      const from = window.posted.length;
      const keptFrom = window.kept.length;
      // Waited for by what happens, not by the clock: when a redraw runs is
      // the browser's to say (a frame of its own), and slower in some.
      const said = (test) => window.posted.slice(from).findIndex(test);
      const previewed = (x) => (m) =>
        m.type === "previewTransform" && m.edits[0].position[0] === x;
      const settled = async (x) => {
        await until(() => said(previewed(x)) >= 0);
        // and the redraw after it, which is when the next may go
        await until(() =>
          window.posted
            .slice(from + said(previewed(x)))
            .some((m) => m.method === "get_scene"),
        );
        await wait(100);
      };
      fire("dragstart", { objectIds: ["cube"], mode: "translate" });
      // A burst, faster than the host answers: the first goes, the newest
      // waits, and those in between are never sent.
      for (let x = 1; x <= 10; x++) fire("objecttransform", pose(x));
      await settled(10);
      for (let x = 11; x <= 15; x++) fire("objecttransform", pose(x));
      await settled(15);
      fire("objecttransform", pose(16, false));
      await wait(300);
      window.result = {
        said: window.posted.slice(from).map((m) => ({
          type: m.type,
          method: m.method,
          objectId: m.objectId,
          field: m.field,
          x: m.edits?.[0]?.position?.[0],
        })),
        kept: window.kept.slice(keptFrom),
      };
    </script>
  </body>
</html>

# Everything green on a machine that is not the one it was written on.
#
# Four jobs because they fail for different reasons: the engine against both
# magpylib versions (the README claims it works with either, and that claim
# was only ever checked by hand), the extension end to end in a real VS
# Code — which needs the engine installed, since that is what it drives —
# the notebook widget in a real browser, which is where it has broken before,
# and the package alone, as pip installs it, with none of this checkout.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: engine (magpylib ${{ matrix.magpylib }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `released` is what `pip install magpylib-studio` gets anyone;
        # `main` is magpylib unreleased, which is where the first-class style
        # API lives and, since it was merged, the display-backend API the 3D
        # scene graph is built on. The studio has to work either way --
        # style_compat.py fills in the first, and the scene graph steps aside
        # without the second -- so both are tested.
        magpylib: [released, main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Switch to magpylib main
        if: matrix.magpylib == 'main'
        run:
          pip install "magpylib @ git+https://github.com/magpylib/magpylib@main"
      - run: python -m pytest -q

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      # The extension spawns `python -m magpylib_studio`; with no .venv here it
      # falls through to python3 on PATH, which is this one.
      - run: pip install -e .
      # The 3D scene graph needs magpylib's display-backend API, which is not
      # in a release yet. Without it `check:scene` has nothing to measure and
      # says so, and `npm run compile` goes green having skipped the check
      # that exists to catch a scene the view cannot draw -- so the one place
      # it was meant to guard was the one place it was silent. It also means
      # the extension is exercised where its main view can actually draw.
      #
      # The cost is that this job now rides on magpylib main. Released is
      # still covered, by the engine job's other leg.
      - name: Use magpylib main, which the scene graph needs
        run:
          pip install "magpylib @ git+https://github.com/magpylib/magpylib@main"
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - name: Compile, lint and check contributions
        working-directory: vscode-extension
        run: npm run compile
      # VS Code needs a display even headless.
      - name: Integration tests
        working-directory: vscode-extension
        run: xvfb-run -a npm test

  widget:
    name: widget in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 22 for its WebSocket: the check talks to Chrome itself. Chrome is
      # already on GitHub's Ubuntu runners.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # three.js, for the pages that load the panel's own renderer
      - name: Install the extension's packages
        working-directory: vscode-extension
        run: npm ci
      - run: pip install -e ".[widget]"
      # The widget draws through magpylib's display-backend API, which is
      # not in a release yet.
      - name: Use magpylib main, which the widget needs
        run:
          pip install "magpylib @ git+https://github.com/magpylib/magpylib@main"
      - name: Drive the widget in headless Chrome
        working-directory: vscode-extension
        run: node harness/check-widget-browser.mjs

  alone:
    name: package alone
    runs-on: ubuntu-latest
    steps:
      # the whole history, for the version hatch-vcs reads off the tags
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the wheel
        run: pipx run build --wheel
      # A fresh environment with the wheel and nothing of the checkout: no
      # editable install, no node, no vscode-extension/. The editable widget
      # has to work with the package alone (docs/editable-widget.md §2).
      - name: Install the wheel alone
        run: |
          python -m venv "$RUNNER_TEMP/alone"
          "$RUNNER_TEMP/alone/bin/pip" install "$(ls dist/*.whl)[widget]"
          "$RUNNER_TEMP/alone/bin/pip" install \
            "magpylib @ git+https://github.com/magpylib/magpylib@main"
      - name: Edit a scene with it, from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/alone/bin/python" \
            "$GITHUB_WORKSPACE/tools/check-package-alone.py"

# Everything green on a machine that is not the one it was written on.
#
# Four jobs because they fail for different reasons: the engine, the extension
# end to end in a real VS Code — which needs the engine installed, since that
# is what it drives — the notebook widget in a real browser, which is where it
# has broken before, and the package alone, as it installs from its wheel, with
# none of this checkout.
#
# Python is uv's, with its cache: an install was 21-29 s a job with pip, and
# is a few with uv.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # magpylib from its main until 6.1, which the engine needs, is on PyPI: see
  # the file. Every `uv pip install` below reads it.
  UV_OVERRIDE: .github/magpylib-main.txt

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
      - run: uv pip install -e ".[dev]"
      - run:
          python -c "import magpylib; print('magpylib', magpylib.__version__)"
      - run: python -m pytest -q

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      # The extension spawns `python -m magpylib_studio`; it finds python3 on
      # PATH, which is the environment uv activated.
      - run: uv pip install -e .
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - name: Compile, lint and check contributions
        working-directory: vscode-extension
        run: npm run compile
      # VS Code needs a display even headless.
      - name: Integration tests
        working-directory: vscode-extension
        run: xvfb-run -a npm test

  widget:
    name: widget in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
      # 22 for its WebSocket: the check talks to Chrome itself. Chrome is
      # already on GitHub's Ubuntu runners.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      # three.js, for the pages that load the panel's own renderer
      - name: Install the extension's packages
        working-directory: vscode-extension
        run: npm ci
      - run: uv pip install -e ".[widget]"
      - name: Drive the widget in headless Chrome
        working-directory: vscode-extension
        run: node harness/check-widget-browser.mjs

  alone:
    name: package alone
    runs-on: ubuntu-latest
    steps:
      # the whole history, for the version hatch-vcs reads off the tags
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build the wheel
        run: uv build --wheel
      # A fresh environment with the wheel and nothing of the checkout: no
      # editable install, no node, no vscode-extension/. The editable widget
      # has to work with the package alone
      # (docs/decisions.md#0010-the-notebook-widget-edits-with-the-package-alone).
      - name: Install the wheel alone
        run: |
          uv venv "$RUNNER_TEMP/alone"
          uv pip install --python "$RUNNER_TEMP/alone" "$(ls dist/*.whl)[widget]"
      - name: Edit a scene with it, from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/alone/bin/python" \
            "$GITHUB_WORKSPACE/tools/check-package-alone.py"
